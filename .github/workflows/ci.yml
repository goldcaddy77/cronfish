name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

  release:
    # Automated versioning + npm publish + GitHub release + CHANGELOG, driven by
    # conventional commits. Runs only on push to main, after tests pass.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release commit + tag
      issues: write # comment on released issues
      pull-requests: write # comment on released PRs
      id-token: write # npm trusted publishing (OIDC); no long-lived NPM_TOKEN
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so semantic-release sees all tags/commits

      - uses: actions/setup-node@v4
        with:
          # npm >= 11.5.1 (bundled with Node 24) is required for OIDC
          # trusted publishing.
          node-version: 24

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        with:
          # @semantic-release/npm >= 12.0.2 exchanges the GitHub OIDC token
          # for a short-lived npm publish token. Granular npm write tokens
          # expire after at most 90 days, which silently broke releases.
          semantic_version: 25
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
